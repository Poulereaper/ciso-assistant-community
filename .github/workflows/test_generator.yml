name: Code Tester

permissions:
  contents: read
  pull-requests: write

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  
concurrency:
  group:
    ${{ github.repository }}-${{ github.event.number || github.head_ref ||
    github.sha }}-${{ github.workflow }}-${{ github.event_name =='pull_request_review_comment' && 'pr_comment' || 'pr' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request_review_comment' }}

jobs:
  Test-Generator-AI-Call:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Generate AI Tests
        uses: Poulereaper/ai-pr-test-generator@v0.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        with:
          debug: true
          review_simple_changes: false
          review_comment_lgtm: false
          ai_api: 'mistral'
          ai_api_base_url: ''
          your_test_gen_bot_name: 'CISO Test Generator'
          #project_context: 'The backend is in python - Unit tests use unitest and poetry for the virtual env --- The frontend is in svelte 4 and 5 - Functionnal tests use test in type script'
            
          
          
